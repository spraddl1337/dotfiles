# List of plugins
#set-option -g default-terminal 'screen-245color'
#set-option -g default-overrides ',xterm-256color:RGB'

set -g base-index 1 # start index window by 1
set -g mouse on
setw -g renumber-window on # renumber windows after close
set -g set-titles on
set -g set-titles-string "#(id -un)@#h"
set -g display-panes-time 2000
set -g pane-border-status top

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect' #   save tmux setup/window+panes
set -g @plugin 'tmux-plugins/tmux-continuum' # resume tmux setup/window+panes
set -g @continuum-restore 'on'               # resume tmux setup/window+panes

set -g @plugin 'dreamsofcode-io/catpuccin-tmux'
#set -g @plugin 'erikw/tmux-powerline'

set -g @plugin 'tmux-plugins/tmux-yank'      # better clipboard support for tmux
# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
